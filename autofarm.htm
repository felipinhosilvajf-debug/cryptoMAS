<html noscrollbar>

<title>Community Board - Auto Farm</title>

<body>

<center>

<table width=755 border=0 cellpadding=0 cellspacing=0>

<tr>
<td align=center>

<table border=0 cellpadding=0 cellspacing=0 width=755 background="l2ui_ct1.Windows_DF_TooltipBG">

<tr>
<td valign="top" align="center">

<!-- TITULO -->

<table width=700 border=0 cellpadding=0 cellspacing=0>

<tr>
<td height=32 align=center>

<font name="hs12" color="LEVEL">
AUTO FARM
</font>

</td>
</tr>

<tr>
<td align=center>

<font color="AAAAAA">
Configure seu Auto Farm
</font>

</td>
</tr>

</table>

<br>

<!-- STATUS + RAIO -->

<table width=600 border=0 cellpadding=0 cellspacing=2>

<tr>

<td width=300 align=center>

<font color="LEVEL">Status:</font>
<font color="3ADF00">%status%</font>

</td>

<td width=300 align=center>

<font color="LEVEL">Raio:</font>
<font color="FFFFFF">%radius%</font>

<button value="Alterar"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:radius"
width=70 height=22
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

</tr>

</table>

<br>

<!-- SLOTS (4 colunas: Skill 1, 2, 3 e Poção) -->

<table width=740 border=0 cellpadding=1 cellspacing=2>

<tr>

<td width=180 align=center>

<font color="LEVEL">SKILL 1</font>

<br>

<button value="%skill1%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill1"
width=175 height=38
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

<td width=180 align=center>

<font color="LEVEL">SKILL 2</font>

<br>

<button value="%skill2%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill2"
width=175 height=38
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

<td width=180 align=center>

<font color="LEVEL">SKILL 3</font>

<br>

<button value="%skill3%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:skill3"
width=175 height=38
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

<td width=180 align=center>

<font color="LEVEL">POCAO</font>

<br>

<button value="%potion%"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:potion"
width=175 height=38
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

</tr>

</table>

<br>

<font color="AAAAAA">
Clique no slot para escolher uma skill, poção ou deixar sem efeito.
</font>

<br><br>

<!-- DIVISORIA -->

<table width=600 border=0 cellpadding=0 cellspacing=0>

<tr>
<td height=1>

<img src="L2UI.SquareGray" width=600 height=1>

</td>
</tr>

</table>

<br>

<!-- BOTOES -->

<table width=600 border=0 cellpadding=0 cellspacing=3>

<tr>

<td width=300 align=center>

<button value="ATIVAR AUTO FARM"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:start"
width=220 height=30
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

<td width=300 align=center>

<button value="DESATIVAR"
action="bypass _bbsscripts;l2f.gameserver.autofarm.AutoFarmCommunity:stop"
width=220 height=30
back="L2UI_CH3.Btn_BF_Down" fore="L2UI_CH3.Btn_BF">

</td>

</tr>

</table>

<br>

<font color="AAAAAA">
Procura monstros, aproxima-se para atacar e coleta os itens.
</font>

<br><br>

<button action="bypass _bbshome"
width=32 height=32
back="L2UI_CT1.MiniMap_DF_MinusBtn_Red_Down"
fore="L2UI_CT1.MiniMap_DF_MinusBtn_Red" />

</td>
</tr>

</table>

</td>
</tr>

</table>

</center>

</body>
</html>
